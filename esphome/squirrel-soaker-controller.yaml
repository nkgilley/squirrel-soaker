# Configure the optional legacy ESP32 relay and manual-button controller.
substitutions:
  name: squirrel-soaker-controller
  friendly_name: Squirrel Soaker Controller
  relay_pin: GPIO26
  button_pin: GPIO27

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

improv_serial:

captive_portal:

web_server:
  port: 80
  local: true

switch:
  - platform: gpio
    id: solenoid_relay
    name: solenoid_relay
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF

number:
  - platform: template
    id: spray_duration
    name: spray_duration
    min_value: 0.1
    max_value: 10.0
    step: 0.1
    initial_value: 3.0
    optimistic: true
    restore_value: true
    unit_of_measurement: s

script:
  - id: spray_once
    mode: single
    then:
      - switch.turn_on: solenoid_relay
      - delay: !lambda |-
          int ms = (int) (id(spray_duration).state * 1000.0f);
          if (ms < 100) {
            ms = 100;
          }
          if (ms > 10000) {
            ms = 10000;
          }
          return ms;
      - switch.turn_off: solenoid_relay

button:
  - platform: template
    id: spray
    name: spray
    on_press:
      - script.execute: spray_once

binary_sensor:
  - platform: gpio
    id: manual_spray_button
    name: manual_spray_button
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: spray_once

sensor:
  - platform: wifi_signal
    name: wifi_signal
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ip_address
