services:
  squirrel-soaker:
    build: .
    container_name: squirrel-soaker
    image: squirrel-soaker:latest
    ports:
      - "5001:5001"
    volumes:
      # Persist images, videos, and dataset folders on the host
      - ./data:/app/data
      # Optionally mount model.pth to persist model updates
      - ./model.pth:/app/model.pth
    environment:
      - TZ=America/New_York
      - PI_IP=192.168.86.107
      - PUBLIC_BASE_URL=http://192.168.86.137
      - CAMERA_SOURCE=pi
      - SNAPSHOT_URL=http://wyze-bridge:5000/snapshot/v3.jpg
      - SPRAY_CONTROLLER_TYPE=pi
    restart: unless-stopped

  wyze-bridge:
    image: mrlt8/wyze-bridge:2.10.3
    container_name: wyze-bridge
    ports:
      - "5050:5000"
      - "8554:8554"
      - "8888:8888"
    volumes:
      - wyze-bridge-tokens:/tokens
    environment:
      - TZ=America/New_York
      - WB_AUTH=false
    restart: unless-stopped

volumes:
  wyze-bridge-tokens:
    external: true
    name: squirrel-soaker-codex_wyze-bridge-tokens
