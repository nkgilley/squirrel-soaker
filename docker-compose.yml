services:
  squirrel-soaker:
    build: .
    container_name: squirrel-soaker
    image: squirrel-soaker:latest
    ports:
      - "5001:5001"
    volumes:
      # Persist images, videos, and dataset folders on the host
      - ./data:/app/data
    environment:
      - TZ=America/New_York
      - PI_IP=${PI_IP:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5001}
      - CAMERA_SOURCE=pi
      - SPRAY_CONTROLLER_TYPE=pi
      - DEVICE_API_TOKEN=${DEVICE_API_TOKEN:?Set DEVICE_API_TOKEN in .env}
      - MAX_SPRAY_DURATION_SECONDS=${MAX_SPRAY_DURATION_SECONDS:-10}
      - MAX_CONTENT_LENGTH_MB=${MAX_CONTENT_LENGTH_MB:-100}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
